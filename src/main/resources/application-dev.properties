
# Server configuration
server.port=8089

# The Graph API key
thegraph.api.key=d59545755cf1974d72a4b387c64e85e9

# Arbitrum RPC URL
ethereum.rpc.url=https://arb1.arbitrum.io/rpc

arbitrum.rpc=https://arb1.arbitrum.io/rpc

# Default pool configuration
uniswap.default.pool=0x641C00A822e8b671738d32a431a4Fb6074E5c79d
uniswap.default.fee=500

# ML model configuration
model.retraining.schedule.hours=24
model.sequence.length=24
model.hidden.size=128
model.learning.rate=0.0005
model.dropout.rate=0.3
model.l2.regularization: 0.00001
model.mini.batch.size: 32
model.epochs=100
model.mc.samples=100



executor.core.pool.size: 5
executor.max.pool.size: 10
executor.queue.capacity: 25


# Logging configuration
logging.level.com.uniswap.predictor=INFO
logging.level.org.springframework=WARN
logging.level.org.deeplearning4j=WARN

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true