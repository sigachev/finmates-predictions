# Server configuration
server.port=8089
spring.application.name=uniswap-price-predictor

# The Graph API key
thegraph.api.key=d59545755cf1974d72a4b387c64e85e9

# Arbitrum RPC URL with fallback options
arbitrum.rpc=https://arb1.arbitrum.io/rpc
arbitrum.rpc.backup1=https://arbitrum-one.public.blastapi.io
arbitrum.rpc.backup2=https://rpc.ankr.com/arbitrum

# Default pool configuration
uniswap.default.pool=0x641C00A822e8b671738d32a431a4Fb6074E5c79d
uniswap.default.fee=500

# ML model configuration
model.retraining.schedule.hours=24
model.retraining.schedule.ms=86400000
model.historical.days=1800
#model.sequence.length=48
#model.hidden.size=128
model.learning.rate=0.0005
model.dropout.rate=0.3
model.l2.regularization=0.00001
model.mini.batch.size=32
model.epochs=100
model.mc.samples=100

# Memory optimization
spring.jvm.memory=-Xmx4g
dl4j.dtype=HALF
dl4j.optimization.level=3

# Training optimization
model.batch.size=32
model.parallel.threads=4
model.early.stopping.patience=5
model.max.training.minutes=30
model.sequence.length=48
model.hidden.size=128

# Async configuration
async.timeout.seconds=10

# Thread pool configuration
executor.core.pool.size=5
executor.max.pool.size=10
executor.queue.capacity=25

# HTTP client configuration
http.connect.timeout=10000
http.read.timeout=30000
http.connection.request.timeout=10000
http.max.total.connections=20
http.max.route.connections=5

# Logging configuration
logging.level.com.uniswap.predictor=DEBUG
logging.level.org.springframework=WARN
logging.level.org.deeplearning4j=WARN
# Enable debug logging for specific services in development
#logging.level.com.uniswap.predictor.service.BlockchainService=DEBUG
#logging.level.com.uniswap.predictor.service.GraphQLService=DEBUG
#logging.level.com.uniswap.predictor.service.DataCollectionService=DEBUG

# Log file configuration
logging.file.name=logs/uniswap-predictor.log
logging.file.max-size=10MB
logging.file.max-history=10

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# Cache configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1h

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always