server.port=8089


#ethereum.node.url=https://arb1.arbitrum.io/rpc
ethereum.node.url=https://arb-mainnet.g.alchemy.com/v2/zAztGaJpmhEJZo1f1wIns665r07-RGgB

# Uniswap V3 ETH/USDT 0.05% pool address
uniswap.v3.pool.address=0x641C00A822e8b671738d32a431a4Fb6074E5c79d


# Web3j Configuration
web3j.http-timeout=30000

# Rate Limiter Configuration
rate.limiter.window-size=60000
rate.limiter.max-requests=100
rate.limiter.bucket-capacity=100
rate.limiter.tokens-per-second=10
rate.limiter.queue-capacity=1000

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=priceData,historicalData
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Metrics Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
# Logging Configuration
logging.level.root=INFO
logging.level.com.finmates=DEBUG
logging.level.org.web3j=INFO
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Thread Pool Configuration
thread.pool.core-size=4
thread.pool.max-size=8
thread.pool.queue-capacity=100
thread.pool.keep-alive-seconds=60

# Price Prediction Configuration
prediction.default-eth-price=2000.0
prediction.base-liquidity=5000000.0
prediction.volatility-percentage=0.02
prediction.liquidity-variation=1000000.0
prediction.mean-reversion-factor=0.05
prediction.price-decimal-places=2
prediction.min-valid-price=100.0
prediction.max-valid-price=10000.0

# Retry Configuration
retry.max-attempts=3
retry.initial-delay=1000
retry.max-delay=10000
retry.multiplier=2

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.uniswap.sliding-window-size=100
resilience4j.circuitbreaker.instances.uniswap.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.uniswap.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.uniswap.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.uniswap.automatic-transition-from-open-to-half-open-enabled=true

# Actuator Configuration
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=${spring.application.name}
info.app.description=Ethereum Price Prediction Service
info.app.version=1.0.0

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha





