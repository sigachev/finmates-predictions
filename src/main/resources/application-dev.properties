# Server configuration
server.port=8089
spring.application.name=uniswap-price-predictor

# The Graph API key
thegraph.api.key=d59545755cf1974d72a4b387c64e85e9

# Arbitrum RPC URL with fallback options
arbitrum.rpc=https://arb1.arbitrum.io/rpc
arbitrum.rpc.backup1=https://arbitrum-one.public.blastapi.io
arbitrum.rpc.backup2=https://rpc.ankr.com/arbitrum

# Default pool configuration
uniswap.default.pool=0x641C00A822e8b671738d32a431a4Fb6074E5c79d
uniswap.default.fee=500

graphql.query.max-retries=3
graphql.query.initial-delay-ms=1000
graphql.query.max-delay-ms=10000
graphql.query.timeout-ms=30000

# ML model configuration
model.retraining.schedule.hours=24
model.retraining.schedule.ms=86400000
model.historical.days=30
#Days of historical data for training
model.training.days=180
model.sequence.length=48
model.hidden.size=128
model.learning.rate=0.0005
model.dropout.rate=0.3
model.l2.regularization=0.00001
model.mini.batch.size=32
model.epochs=10
model.mc.samples=100

# Async configuration
async.timeout.seconds=10

# Thread pool configuration
executor.core.pool.size=5
executor.max.pool.size=10
executor.queue.capacity=25

# HTTP client configuration
http.connect.timeout=10000
http.read.timeout=30000
http.connection.request.timeout=10000
http.max.total.connections=20
http.max.route.connections=5

# Swagger OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Logging configuration
logging.level.com.uniswap.predictor=DEBUG
logging.level.org.springframework=WARN
logging.level.org.deeplearning4j=WARN